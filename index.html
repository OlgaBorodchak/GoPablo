<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Transform your space with GoPablo Renovation — Ottawa's trusted home renovation experts. Basements, bathrooms, flooring, drywall, and more. Free estimates and quality workmanship."
    />
    <title>
      Basement, Bathroom & Home Renovation Experts in Ottawa | GoPablo
    </title>
    <link rel="stylesheet" href="./styles/typography.css" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link
      rel="icon"
      type="image/png"
      href="./favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
    <link rel="shortcut icon" href="./favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="./favicon/site.webmanifest" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <nav class="nav">
          <a href="/" class="nav-logo">
            <img src="./assets/images/logo.png" alt="GoPablo Renovation Logo" />
          </a>
          <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
            <span class="bar bar-top"></span>
            <span class="bar bar-middle"></span>
            <span class="bar bar-bottom"></span>
          </button>
          <ul class="nav-list">
            <li><a href="#projects" class="nav-link">Projects</a></li>
            <li><a href="#services" class="nav-link">Services</a></li>
            <li><a href="#steps" class="nav-link">Steps</a></li>
            <li><a href="#faq" class="nav-link">FAQ</a></li>
            <li><a href="#testimonials" class="nav-link">Testimonials</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="container">
          <video class="hero-video" autoplay loop muted playsinline preload="auto">
            <source src="./assets/videos/couple-home-video.mp4" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <h1>
              Renovations for 
              <span>Ottawa</span> 
              families
            </h1>
            <a href="#testimonials" class="hero-link">
              Book Consultation
              <img src="./assets/icons/white_arrow.svg" width="16" height="14" alt="arrow" />
            </a>
          </div>
        </div>
      </section>
      <section id="#about">
        <h2>We’re proud to call Ottawa home. 
            From Kanata to Orleans, we’ve helped families turn their houses into homes they truly love. 
            Every renovation we do is a promise to our community. 
        </h2>
      </section>
    </main>
  </body>

  <script src="./js/script.js"></script>
</html>
